name: Deploy to IONOS

on:
  push:
    branches:
      - main

# Un seul déploiement à la fois : les push successifs sont mis en file
# d'attente et s'exécutent l'un après l'autre, jamais en parallèle.
# Cela évite que plusieurs uploads SFTP simultanés se corrompent entre eux.
concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload by SFTP
        run: |
          n=0
          until [ $n -ge 3 ]; do
          lftp <<EOF && break
          open -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" sftp://${{ secrets.FTP_HOST }}:22
          set sftp:auto-confirm yes
          set net:timeout 40
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1.5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          mirror -R --verbose --continue --exclude .git/ --exclude .github/ ./ "${{ secrets.FTP_REMOTE_DIR }}"
          bye
          EOF
          n=$((n+1))
          echo "::warning::Upload SFTP échoué, nouvelle tentative $n/3 dans 20 s..."
          sleep 20
          done
          if [ $n -ge 3 ]; then
            echo "::error::Déploiement échoué après 3 tentatives."
            exit 1
          fi
          echo "Déploiement terminé avec succès."
