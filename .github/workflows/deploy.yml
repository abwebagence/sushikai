name: Deploy to IONOS

on:
  push:
    branches:
      - main

# Un seul déploiement à la fois : les push successifs sont mis en file
# d'attente et s'exécutent l'un après l'autre, jamais en parallèle.
# Cela évite que plusieurs uploads SFTP simultanés se corrompent entre eux.
concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload by SFTP
        run: |
          lftp <<EOF
          open -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" sftp://${{ secrets.FTP_HOST }}:22
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 2
          mirror -R --verbose --exclude .git/ --exclude .github/ ./ "${{ secrets.FTP_REMOTE_DIR }}"
          bye
          EOF